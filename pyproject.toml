[project]
name = "vibescan"
version = "0.1.0"
description = "VibeScan CLI"
requires-python = ">=3.10"
dependencies = [
    "typer",
    "rich",
    "httpx",
    "beautifulsoup4",
    "python-nmap",
]

[project.scripts]
vibescan = "vibescan.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.poetry]
name = "vibescan"
version = "0.1.0"
description = "VibeScan CLI"
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = ">=3.10"
typer = "*"
rich = "*"
httpx = "*"
beautifulsoup4 = "*"
python-nmap = "*"


[tool.poetry.dev-dependencies]
pytest = "*"
pytest-mock = "*"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
